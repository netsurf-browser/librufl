name: "Static Analysis"

on: [push]

jobs:
  static-analysis:
    permissions:
      contents: read
      security-events: write
    uses: netsurf-browser/ci-tools/.github/workflows/static-analysis.yaml@master
    with:
      # Needs the arm-unknown-riscos toolchain's OSLib headers.
      extra-toolchain: arm-unknown-riscos
