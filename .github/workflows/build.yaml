name: "Build"

on: [push, pull_request]

jobs:
  build:
    # Branches in this repo already get CI from the push; only run PR
    # builds for PRs from forks (which a maintainer must approve).
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork
    uses: netsurf-browser/ci-tools/.github/workflows/library-build.yaml@master
    with:
      # RISC OS only library.
      toolchains: '["arm-unknown-riscos"]'
      # Native builds need the arm-unknown-riscos toolchain's OSLib headers.
      extra-toolchain: arm-unknown-riscos
