# Configuration for basic substitution

%fontmanager 380 UCS NoPreload

# Font name		Enc.	Filename	isSym	hasEnc
ASCII.Bold		UTF8	ASCIIGlyphMap	0	0
ASCII.Bold.Italic	UTF8	ASCIIGlyphMap	0	0
ASCII.Medium		UTF8	ASCIIGlyphMap	0	0
ASCII.Medium.Italic	UTF8	ASCIIGlyphMap	0	0
BFreeSans		UTF8	Latin1GlyphMap	0	0
BFreeSans.Bold		UTF8	Latin1GlyphMap	0	0
BFreeSans.Italic	UTF8	Latin1GlyphMap	0	0
Corpus.Medium		Latin1	Latin1GlyphMap	0	0
Homerton.Bold		UTF8	Latin1GlyphMap	0	0
Homerton.Bold.Italic	UTF8	Latin1GlyphMap	0	0
Homerton.Medium		UTF8	Latin1GlyphMap	0	0
Homerton.Medium.Italic	UTF8	Latin1GlyphMap	0	0

# Test cases and expectations

#	TestNo	Font	Style	Input
%tcase	1	ASCII	500	!\xe2\x80\xa2Z\xc2\xb0
# Paint a string containing characters from the ASCII and Latin1
# encodings using the ASCII-only font. We expect the Latin1
# characters to be drawn using the first Latin1 font in the font
# table, no matter what style is requested.
#		Font		Enc.	xoff	ydiv	sdiv	trfm	Text
%expect	1	ASCII.Medium	UTF8	0	0	1	0	!
%expect	1	BFreeSans	UTF8	1	0	1	0	\xe2\x80\xa2
%expect	1	ASCII.Medium	UTF8	2	0	1	0	Z
%expect	1	BFreeSans	UTF8	3	0	1	0	\xc2\xb0

#	TestNo	Font	Style	Input
%tcase	2	ASCII	700	!\xe2\x80\xa2Z\xc2\xb0
# Paint a string containing characters from the ASCII and Latin1
# encodings using the ASCII.Bold font. We expect the Latin1
# characters to be drawn using the first Latin1 font in the font
# table, even though a bold weight is requested.
#		Font		Enc.	xoff	ydiv	sdiv	trfm	Text
%expect	2	ASCII.Bold	UTF8	0	0	1	0	!
%expect	2	BFreeSans.Bold	UTF8	1	0	1	0	\xe2\x80\xa2
%expect	2	ASCII.Bold	UTF8	2	0	1	0	Z
%expect	2	BFreeSans.Bold	UTF8	3	0	1	0	\xc2\xb0

#	TestNo	Font	Style	Input
%tcase	3	ASCII	500/	!\xe2\x80\xa2Z\xc2\xb0
# Paint a string containing characters from the ASCII and Latin1
# encodings using the ASCII.Italic font. We expect the Latin1
# characters to be drawn using the first Latin1 font in the font
# table, with a transformation applied.
#		Font			Enc.	xoff	ydiv	sdiv	trfm	Text
%expect	3	ASCII.Medium.Italic	UTF8	0	0	1	0	!
%expect	3	BFreeSans.Italic	UTF8	1	0	1	0	\xe2\x80\xa2
%expect	3	ASCII.Medium.Italic	UTF8	2	0	1	0	Z
%expect	3	BFreeSans.Italic	UTF8	3	0	1	0	\xc2\xb0

#	TestNo	Font	Style	Input
%tcase	4	ASCII	700/	!\xe2\x80\xa2Z\xc2\xb0
# Paint a string containing characters from the ASCII and Latin1
# encodings using the ASCII.Bold.Italic font. We expect the Latin1
# characters to be drawn using the first Latin1 font in the font
# table, with a transformation applied.
#		Font			Enc.	xoff	ydiv	sdiv	trfm	Text
%expect	4	ASCII.Bold.Italic	UTF8	0	0	1	0	!
%expect	4	BFreeSans.Bold		UTF8	1	0	1	1	\xe2\x80\xa2
%expect	4	ASCII.Bold.Italic	UTF8	2	0	1	0	Z
%expect	4	BFreeSans.Bold		UTF8	3	0	1	1	\xc2\xb0
