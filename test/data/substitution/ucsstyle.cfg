# Configuration for basic substitution

%fontmanager 380 UCS NoPreload

# Font name		Enc.	Filename	isSym	hasEnc
ASCII.Bold		UTF8	ASCIIGlyphMap	0	0
ASCII.Bold.Italic	UTF8	ASCIIGlyphMap	0	0
ASCII.Medium		UTF8	ASCIIGlyphMap	0	0
ASCII.Medium.Italic	UTF8	ASCIIGlyphMap	0	0
ASCII.Narrow.Medium	UTF8	ASCIIGlyphMap	0	0
ASCII.Narrow.Medium.Italic	UTF8	ASCIIGlyphMap	0	0
BFreeSans		UTF8	Latin1GlyphMap	0	0
BFreeSans.Bold		UTF8	Latin1GlyphMap	0	0
BFreeSans.Italic	UTF8	Latin1GlyphMap	0	0
Corpus.Medium		Latin1	Latin1GlyphMap	0	0
Homerton.Bold		UTF8	Latin1GlyphMap	0	0
Homerton.Bold.Italic	UTF8	Latin1GlyphMap	0	0
Homerton.MedBold	UTF8	Latin1GlyphMap	0	0
Homerton.MedBold.Italic	UTF8	Latin1GlyphMap	0	0
Homerton.Medium		UTF8	Latin1GlyphMap	0	0
Homerton.Medium.Italic	UTF8	Latin1GlyphMap	0	0
Homerton.SemiBold	UTF8	Latin1GlyphMap	0	0
Homerton.SemiBold.Italic	UTF8	Latin1GlyphMap	0	0
Homerton.SmallCaps.Medium	UTF8	Latin1GlyphMap	0	0
Homerton.SmallCaps.Medium.Italic	UTF8	Latin1GlyphMap	0	0
JustSymbol		UTF8	Latin1GlyphMap	1	1
JustSymbol.SmallCaps	UTF8	SCGlyphMap	1	1
LegacySymbol		UTF8	Latin1GlyphMap	1	0
LegacySymbol.SmallCaps	UTF8	Latin1GlyphMap	1	0

# Test cases and expectations

#	TestNo	Font	Style	Input
%tcase	1	ASCII	500	!\xe2\x80\xa2Z\xc2\xb0
# Paint a string containing characters from the ASCII and Latin1
# encodings using the ASCII-only font. We expect the Latin1
# characters to be drawn using the first Latin1 font in the font
# table, no matter what style is requested.
#		Font		Enc.	xoff	ydiv	sdiv	trfm	Text
%expect	1	ASCII.Medium	UTF8	0	0	1	0	!
%expect	1	BFreeSans	UTF8	1	0	1	0	\xe2\x80\xa2
%expect	1	ASCII.Medium	UTF8	2	0	1	0	Z
%expect	1	BFreeSans	UTF8	3	0	1	0	\xc2\xb0

#	TestNo	Font	Style	Input
%tcase	2	ASCII	700	!\xe2\x80\xa2Z\xc2\xb0
# Paint a string containing characters from the ASCII and Latin1
# encodings using the ASCII.Bold font. We expect the Latin1
# characters to be drawn using the first Latin1 font in the font
# table, even though a bold weight is requested.
#		Font		Enc.	xoff	ydiv	sdiv	trfm	Text
%expect	2	ASCII.Bold	UTF8	0	0	1	0	!
%expect	2	BFreeSans.Bold	UTF8	1	0	1	0	\xe2\x80\xa2
%expect	2	ASCII.Bold	UTF8	2	0	1	0	Z
%expect	2	BFreeSans.Bold	UTF8	3	0	1	0	\xc2\xb0

#	TestNo	Font	Style	Input
%tcase	3	ASCII	500/	!\xe2\x80\xa2Z\xc2\xb0
# Paint a string containing characters from the ASCII and Latin1
# encodings using the ASCII.Italic font. We expect the Latin1
# characters to be drawn using the first Latin1 font in the font
# table, with a transformation applied.
#		Font			Enc.	xoff	ydiv	sdiv	trfm	Text
%expect	3	ASCII.Medium.Italic	UTF8	0	0	1	0	!
%expect	3	BFreeSans.Italic	UTF8	1	0	1	0	\xe2\x80\xa2
%expect	3	ASCII.Medium.Italic	UTF8	2	0	1	0	Z
%expect	3	BFreeSans.Italic	UTF8	3	0	1	0	\xc2\xb0

#	TestNo	Font	Style	Input
%tcase	4	ASCII	700/	!\xe2\x80\xa2Z\xc2\xb0
# Paint a string containing characters from the ASCII and Latin1
# encodings using the ASCII.Bold.Italic font. We expect the Latin1
# characters to be drawn using the first Latin1 font in the font
# table, with a transformation applied.
#		Font			Enc.	xoff	ydiv	sdiv	trfm	Text
%expect	4	ASCII.Bold.Italic	UTF8	0	0	1	0	!
%expect	4	BFreeSans.Bold		UTF8	1	0	1	1	\xe2\x80\xa2
%expect	4	ASCII.Bold.Italic	UTF8	2	0	1	0	Z
%expect	4	BFreeSans.Bold		UTF8	3	0	1	1	\xc2\xb0

#	TestNo	Font		Style	Input
%tcase	5	Homerton	600	!\xe2\x80\xa2Z\xc2\xb0
# Paint a string containing characters from the ASCII and Latin1
# encodings requesting Homerton and a semi-bold weight. We expect
# the characters to be drawn using Homerton.SemiBold and not
# Homerton.MedBold (which falls into the same weight bucket).
#		Font			Enc.	xoff	ydiv	sdiv	trfm	Text
%expect	5	Homerton.SemiBold	UTF8	0	0	1	0	!\xe2\x80\xa2Z\xc2\xb0

#	TestNo	Font		Style	Input
%tcase	6	Homerton	600/	!\xe2\x80\xa2Z\xc2\xb0
# Paint a string containing characters from the ASCII and Latin1
# encodings requesting Homerton and a semi-bold weight with slant.
# We expect the characters to be drawn using Homerton.SemiBold.Italic
# and not Homerton.MedBold.Italic (which falls into the same weight bucket).
#		Font			Enc.	xoff	ydiv	sdiv	trfm	Text
%expect	6	Homerton.SemiBold.Italic	UTF8	0	0	1	0	!\xe2\x80\xa2Z\xc2\xb0

%tcase	7	\FASCII.Narrow.Medium.Italic	100	!\xe2\x80\xa2Z\xc2\xb0
# Paint a string using ASCII.Narrow.Medium.Italic. This ordinarily would
# not be used, but we can now select it directly, so ensure that this works
# and that substituted glyphs obtain a similar style. We additionally specify
# a style that should never be used and verify that the resulting text has
# no transform applied.
#		Font		Enc.	xoff	ydiv	sdiv	trfm	Text
%expect	7	ASCII.Narrow.Medium.Italic	UTF8	0	0	1	0	!
%expect	7	BFreeSans.Italic	UTF8	1	0	1	0	\xe2\x80\xa2
%expect	7	ASCII.Narrow.Medium.Italic	UTF8	2	0	1	0	Z
%expect	7	BFreeSans.Italic	UTF8	3	0	1	0	\xc2\xb0

#	TestNo	Font		Style	Input
%tcase	8	ASCII		200w400	!
# Paint a string using ASCII and asking for a condensed variant.
# Expect that ASCII.Narrow.Medium is used.
#		Font			Enc.	xoff	ydiv	sdiv	trfm	Text
%expect	8	ASCII.Narrow.Medium	UTF8	0	0	1	0	!

#	TestNo	Font		Style	Input
%tcase	9	ASCII		200w400/	!
# Paint a string using ASCII and asking for a condensed, italic variant.
# Expect that ASCII.Narrow.Medium.Italic is used.
#		Font			Enc.	xoff	ydiv	sdiv	trfm	Text
%expect	9	ASCII.Narrow.Medium.Italic	UTF8	0	0	1	0	!

#	TestNo	Font		Style	Input
%tcase	10	Homerton	200w400C	a
# Paint a string using Homerton and asking for a condensed, small caps variant.
# Expect that Homerton.SmallCaps.Medium is used with standardised codepoints
#		Font			Enc.	xoff	ydiv	sdiv	trfm	Text
%expect	10	Homerton.SmallCaps.Medium	UTF8	0	0	1	0	a

#	TestNo	Font		Style	Input
%tcase	11	Homerton	200w400/C	a
# Paint a string using Homerton and asking for a condensed, italic, small caps
# variant. Expect that Homerton.SmallCaps.Medium.Italic is used with
# standardised codepoints.
#		Font			Enc.	xoff	ydiv	sdiv	trfm	Text
%expect	11	Homerton.SmallCaps.Medium.Italic	UTF8	0	0	1	0	a

#	TestNo	Font		Style	Input
%tcase	12	LegacySymbol	400C	a
# Paint a string using LegacySymbol and asking for a small caps variant.
# Expect that LegacySymbol.SmallCaps is used with standardised codepoints
#		Font			Enc.	xoff	ydiv	sdiv	trfm	Text
%expect	12	LegacySymbol.SmallCaps	UTF8	0	0	1	0	a

#	TestNo	Font		Style	Input
%tcase	13	JustSymbol	400C	a
# Paint a string using JustSymbol and asking for a small caps variant.
# Expect that JustSymbol.SmallCaps is used with PUA codepoints
#		Font			Enc.	xoff	ydiv	sdiv	trfm	Text
%expect	13	JustSymbol.SmallCaps	UTF8	0	0	1	0	\xef\x9d\xa1

#	TestNo	Font		Style	Input
%tcase	14	\FJustSymbol.SmallCaps	100/	a
# Paint a string using JustSymbol.SmallCaps and specifying an unused style.
# Expect that JustSymbol.SmallCaps is used with PUA codepoints and the style
# is ignored.
#		Font			Enc.	xoff	ydiv	sdiv	trfm	Text
%expect	14	JustSymbol.SmallCaps	UTF8	0	0	1	0	\xef\x9d\xa1
