# Configuration for substitution with a sparsely populated font

%fontmanager 380 UCS NoPreload

# Font name		Enc.	Filename		isSym	hasEnc
AAAAA.Medium		UTF8	SparseGlyphMap		0	0
AL1Only.Medium		UTF8	Latin1OnlyGlyphMap	0	0
BSubst.Medium		UTF8	Latin1GlyphMap		0	0
Corpus.Medium		Latin1	Latin1GlyphMap		0	0
Homerton.Medium		UTF8	Latin1GlyphMap		0	0

# Test cases and expectations

#	TestNo	Font	Style	Input
%tcase	1	AL1Only	500	\x20!$012?@ABCPQ\x60abcpq\xc2\xa0
# Paint a string using the L1Only font and verify that other
# fonts are used to provide glyphs for the characters that it
# does not possess. The BSubst font should be preferred over
# AAAAA because it has fuller coverage of each block.
#		Font		Enc.	xoff	ydiv	sdiv	tfrm	Text
%expect	1	BSubst.Medium	UTF8	0	0	1	0	\x20!$012?@ABCPQ\x60abcpq
%expect	1	AL1Only.Medium	UTF8	19	0	1	0	\xc2\xa0
