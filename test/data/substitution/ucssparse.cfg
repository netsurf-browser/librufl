# Configuration for substitution with a sparsely populated font

%fontmanager 380 UCS NoPreload

# Font name		Encoding name	Filename
AAAAA.Medium		UTF8		SparseGlyphMap
AL1Only.Medium		UTF8		Latin1OnlyGlyphMap
BSubst.Medium		UTF8		Latin1GlyphMap
Corpus.Medium		Latin1		Latin1GlyphMap
Homerton.Medium		UTF8		Latin1GlyphMap

# Test cases and expectations

#	TestNo	Font	Style	Input
%tcase	1	AL1Only	500	\x20!$012?@ABCPQ\x60abcpq\xc2\xa0
# Paint a string using the L1Only font and verify that other
# fonts are used to provide glyphs for the characters that it
# does not possess.
#		Font		Enc.	xoff	ydiv	sdiv	trfm	Text
%expect	1	AAAAA.Medium	UTF8	0	0	1	0	\x20
%expect	1	BSubst.Medium	UTF8	1	0	1	0	!$
%expect	1	AAAAA.Medium	UTF8	3	0	1	0	0
%expect	1	BSubst.Medium	UTF8	4	0	1	0	12?
%expect	1	AAAAA.Medium	UTF8	7	0	1	0	@
%expect	1	BSubst.Medium	UTF8	8	0	1	0	ABC
%expect	1	AAAAA.Medium	UTF8	11	0	1	0	P
%expect	1	BSubst.Medium	UTF8	12	0	1	0	Q
%expect	1	AAAAA.Medium	UTF8	13	0	1	0	\x60
%expect	1	BSubst.Medium	UTF8	14	0	1	0	abc
%expect	1	AAAAA.Medium	UTF8	17	0	1	0	p
%expect	1	BSubst.Medium	UTF8	18	0	1	0	q
%expect	1	AL1Only.Medium	UTF8	19	0	1	0	\xc2\xa0
