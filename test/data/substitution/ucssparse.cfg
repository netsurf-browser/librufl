# Configuration for substitution with a sparsely populated font

%fontmanager 380 UCS NoPreload

# Font name		Encoding name	Filename
AAAAA.Medium		UTF8		SparseGlyphMap
AL1Only.Medium		UTF8		Latin1OnlyGlyphMap
BSubst.Medium		UTF8		Latin1GlyphMap
Corpus.Medium		Latin1		Latin1GlyphMap
Homerton.Medium		UTF8		Latin1GlyphMap

# Test cases and expectations

#	TestNo	Font	Style	Input
%tcase	1	AL1Only	500	\x20!$012?@ABCPQ\x60abcpq\xc2\xa0
# Paint a string using the L1Only font and verify that other
# fonts are used to provide glyphs for the characters that it
# does not possess.
#		Font		Enc.	xoff	ydiv	sdiv	Text
%expect	1	BSubst.Medium	UTF8	0	0	1	\x20!$012?@ABCPQ\x60abcpq
%expect	1	AL1Only.Medium	UTF8	19	0	1	\xc2\xa0
