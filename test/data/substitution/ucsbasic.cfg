# Configuration for basic substitution

%fontmanager 380 UCS NoPreload

# Font name		Enc.	Filename	isSym	hasEnc
ASCII.Medium		UTF8	ASCIIGlyphMap	0	0
ASym			UTF8	Latin1GlyphMap	1	0
BLatin1.Medium		UTF8	Latin1GlyphMap	0	0
BLatin1.Narrow.Medium	UTF8	Latin1GlyphMap	0	0
Corpus.Medium		Latin1	Latin1GlyphMap	0	0
Homerton.Medium		UTF8	Latin1GlyphMap	0	0

# Test cases and expectations

#	TestNo	Font	Style	Input
%tcase	1	ASCII	500	!\xe2\x80\xa2\xdc\x80
# Paint a string containing characters from the ASCII, Latin1,
# and neither encodings using the ASCII-only font. We expect the
# Latin1 characters to be drawn using the Latin1 font. We expect
# the unrepresentable characters to result in tofu drawn in Corpus
#		Font		Enc.	xoff	ydiv	sdiv	trfm	Text
%expect	1	ASCII.Medium	UTF8	0	0	1	0	!
%expect	1	BLatin1.Medium	UTF8	1	0	1	0	\xe2\x80\xa2
%expect	1	Corpus.Medium	Latin1	2	2	2	0	07
%expect	1	Corpus.Medium	Latin1	2	0	2	0	00

%tcase	2	\FBLatin1.Narrow.Medium	100/	!
# Paint a string using BLatin1.Narrow.Medium. This ordinarily would
# not be used, but we can now select it directly, so ensure that
# this works. We additionally specify a style that should never be
# used and verify that the resulting text has no transform applied.
#		Font		Enc.	xoff	ydiv	sdiv	trfm	Text
%expect	2	BLatin1.Narrow.Medium	UTF8	0	0	1	0	!
